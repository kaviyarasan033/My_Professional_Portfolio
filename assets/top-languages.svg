    <rect x="515" y="0" width="117" height="10" rx="5" fill="#3572A5"/>
    <rect x="636" y="0" width="78" height="10" rx="5" fill="#89e051"/>
    <rect x="718" y="0" width="62" height="10" rx="5" fill="#e34c26"/>
  </g>

  <g transform="translate(35, 90)">
